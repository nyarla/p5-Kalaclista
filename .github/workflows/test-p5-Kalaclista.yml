name: Run tests for p5-Kalaclista

permissions: {}

env:
  perl-version: "5.44"

on:
  pull_request:
    branches: ["*"]
    paths:
      - ".github/workflows/test-p5-Kalaclista.yml"
      - "cpanfile"
      - "cpanfile.snapshot"
      - "lib/**"
      - "t/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-p5-Kalaclista.yml"
      - "cpanfile"
      - "cpanfile.snapshot"
      - "lib/**"
      - "t/**"

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  prove:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install CPAN modules dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libidn-dev
      - uses: shogo82148/actions-setup-perl@8b574cdc2dffdae49f803204a4f2b716a2fa1db7 # v1.44.2
        with:
          perl-version: ${{ env.perl-version }}
          enable-modules-cache: true
          install-modules-with: cpm
          install-modules-args: Carton::Snapshot
      - name: Install CPAN modules
        run: |
          cpm install -Llocal
      - name: Run tests
        run: |
          prove -Ilocal/lib/perl5 -Ilib -It/lib -vr t/
